version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: objstore_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: objstore
    ports:
      - "5441:5432"
    volumes:
      - objstore_pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d objstore"]
      interval: 3s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: objstore_backend
    environment:
      PORT: 4001
      DATABASE_URL: postgres://postgres:postgres@db:5432/objstore
      JWT_SECRET: supersecret_objstore_jwt_key_2026
      CORS_ORIGIN: http://localhost:3001
    ports:
      - "4001:4001"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4001
    container_name: objstore_frontend
    ports:
      - "3001:3001"
    depends_on:
      - backend

volumes:
  objstore_pgdata:
